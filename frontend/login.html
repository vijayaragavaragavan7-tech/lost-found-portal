<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login - Lost & Found Portal</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="navbar" class="navbar"></div>

<div class="container auth-wrap">
  <div class="card">
    <h2 class="page-title">Welcome back 👋</h2>
    <p class="page-subtitle">Login to report or track lost &amp; found items.</p>

    <div id="alertBox"></div>

    <form id="loginForm">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" required placeholder="you@campus.edu" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" required placeholder="••••••••" />
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;">Login</button>
    </form>

    <p class="auth-switch">Don't have an account? <a href="register.html">Register here</a></p>
    <p class="auth-switch" style="font-size:0.78rem;">Admin demo login: admin@campus.edu / admin123</p>
  </div>
</div>

<script src="js/api.js"></script>
<script>
  if (isLoggedIn()) window.location.href = "dashboard.html";

  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const alertBox = document.getElementById("alertBox");
    alertBox.innerHTML = "";

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    try {
      const { token, user } = await apiRequest("/auth/login", {
        method: "POST",
        auth: false,
        body: { email, password },
      });
      setSession(token, user);
      window.location.href = user.role === "admin" ? "admin.html" : "dashboard.html";
    } catch (err) {
      alertBox.innerHTML = `<div class="alert alert-error">${escapeHtml(err.message)}</div>`;
    }
  });
</script>
</body>
</html>
