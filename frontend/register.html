<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Register - Lost & Found Portal</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="navbar" class="navbar"></div>

<div class="container auth-wrap">
  <div class="card">
    <h2 class="page-title">Create your account 🎓</h2>
    <p class="page-subtitle">Register with your campus email to get started.</p>

    <div id="alertBox"></div>

    <form id="registerForm">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="name" required placeholder="e.g. Arjun Kumar" />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" required placeholder="you@campus.edu" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" required minlength="6" placeholder="At least 6 characters" />
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;">Register</button>
    </form>

    <p class="auth-switch">Already have an account? <a href="login.html">Login here</a></p>
  </div>
</div>

<script src="js/api.js"></script>
<script>
  if (isLoggedIn()) window.location.href = "dashboard.html";

  document.getElementById("registerForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const alertBox = document.getElementById("alertBox");
    alertBox.innerHTML = "";

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    try {
      const { token, user } = await apiRequest("/auth/register", {
        method: "POST",
        auth: false,
        body: { name, email, password },
      });
      setSession(token, user);
      window.location.href = "dashboard.html";
    } catch (err) {
      alertBox.innerHTML = `<div class="alert alert-error">${escapeHtml(err.message)}</div>`;
    }
  });
</script>
</body>
</html>
